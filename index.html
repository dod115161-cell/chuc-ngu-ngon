<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chúc Ngủ Ngon</title>
<meta name="description" content="Một lời chúc ngủ ngon nhỏ, cuộn chuột hoặc vuốt để xem.">
<meta property="og:title" content="Chúc bạn ngủ ngon nhé ☾">
<meta property="og:description" content="Cuộn chuột hoặc vuốt màn hình để xem lời nhắn.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;800;900&family=Playfair+Display:ital,wght@0,500;0,800;1,500;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#6b1f4a; --paper:#fff0f5; --rose:#ff6fa5;
  --sans:'Be Vietnam Pro',system-ui,sans-serif; --serif:'Playfair Display',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#2a1838;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body.has-cursor, body.has-cursor *{cursor:none!important}
button{font-family:inherit}
#spacer{width:1px}
.scene{position:fixed;inset:0;visibility:hidden;will-change:transform,clip-path}
.stage{position:absolute;inset:0;overflow:hidden;transform-origin:50% 50%;will-change:transform}
.shade{position:absolute;inset:0;background:#1a0b22;opacity:0;pointer-events:none}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 52%,var(--s3) 100%)}
.glow{position:absolute;left:50%;top:58%;width:120vmax;height:120vmax;margin:-60vmax 0 0 -60vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.45),rgba(255,255,255,0));pointer-events:none}

/* ---------- clouds ---------- */
.layer{position:absolute;inset:-8%;will-change:transform;pointer-events:none}
.cl{position:absolute;left:0;will-change:transform;animation:drift linear infinite}
.cl svg{width:100%;height:auto;display:block;overflow:visible}
.far .cl{opacity:.6;filter:blur(1.5px)}
.mid .cl{opacity:.85}
.near .cl{opacity:.97;filter:drop-shadow(0 18px 30px rgba(120,30,80,.18))}
@keyframes drift{from{transform:translateX(-60vw)}to{transform:translateX(130vw)}}
.bob{animation:bob 6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-6px)}to{transform:translateY(8px)}}
.bank{position:absolute;left:-10%;right:-10%;bottom:-4vh;height:34vh;will-change:transform;pointer-events:none}
.bank svg{width:100%;height:100%;display:block}
.edge{position:absolute;left:0;right:0;top:-60px;height:62px;pointer-events:none}
.edge svg{width:100%;height:100%;display:block}

/* ---------- stars & moon ---------- */
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.8);animation:tw 2.4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.15;transform:scale(.6)}to{opacity:1;transform:scale(1.1)}}
.moon{position:absolute;right:12vw;top:12vh;width:clamp(70px,9vw,130px);aspect-ratio:1;border-radius:50%;background:#fff6e6;box-shadow:0 0 60px 20px rgba(255,230,240,.45),0 0 160px 60px rgba(255,180,210,.25);will-change:transform}
.moon::after{content:"";position:absolute;width:100%;height:100%;border-radius:50%;left:28%;top:-14%;background:var(--s1)}

/* ---------- UI chrome ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:70;display:flex;align-items:flex-start;justify-content:space-between;padding:22px 30px;pointer-events:none}
.brand{color:#fff;mix-blend-mode:difference;text-decoration:none;pointer-events:auto}
.brand b{display:block;font-family:var(--serif);font-weight:800;font-size:24px;letter-spacing:-.5px}
.brand small{display:block;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;margin-top:6px;opacity:.85}
.pill{pointer-events:auto;border:0;border-radius:999px;padding:11px 18px;font-weight:600;font-size:13px;background:rgba(255,255,255,.85);color:var(--ink);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;gap:8px;transition:transform .3s cubic-bezier(.3,1.6,.5,1),opacity .4s}
.pill:hover{transform:scale(1.06)}
.chapters{position:fixed;left:30px;bottom:30px;z-index:70;mix-blend-mode:difference;list-style:none;margin:0;padding:0;font-size:11.5px;letter-spacing:.3px}
.chapters li{color:rgba(255,255,255,.55);padding:3px 0;display:flex;align-items:center;gap:10px;cursor:pointer;transition:color .4s,transform .4s}
.chapters li::before{content:"";width:14px;height:1px;background:currentColor;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.chapters li.on{color:#fff;transform:translateX(4px)}
.chapters li.on::before{width:34px}
.progress{position:fixed;right:30px;bottom:30px;z-index:70;mix-blend-mode:difference;width:3px;height:120px;background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden}
.progress i{position:absolute;left:0;top:0;width:100%;background:#fff;border-radius:3px}
.next{position:fixed;left:50%;bottom:26px;z-index:70;transform:translateX(-50%);color:#fff;mix-blend-mode:difference;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;text-align:center;pointer-events:none;transition:opacity .5s}
.next span{display:block;font-size:18px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* ---------- top guide (hướng dẫn) ---------- */
.guide{position:fixed;top:86px;left:50%;z-index:72;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:12px 20px 12px 16px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 14px 40px -12px rgba(150,40,100,.35);color:var(--ink);font-size:14px;font-weight:600;white-space:nowrap;will-change:transform,opacity}
.guide small{display:block;font-weight:400;font-size:12px;opacity:.7;margin-top:2px}
.mouse{flex:none;width:20px;height:32px;border:1.6px solid var(--ink);border-radius:11px;position:relative}
.mouse::after{content:"";position:absolute;left:50%;top:6px;width:3px;height:6px;border-radius:2px;background:var(--ink);transform:translateX(-50%);animation:wheel 1.6s infinite}
@keyframes wheel{0%{opacity:0;transform:translate(-50%,0)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,11px)}}
.finger{flex:none;width:22px;height:34px;position:relative}
.finger::before{content:"";position:absolute;left:50%;top:0;width:2px;height:100%;margin-left:-1px;background:linear-gradient(transparent,rgba(107,31,74,.35));border-radius:2px}
.finger::after{content:"";position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 4px rgba(255,111,165,.25);animation:swipe 1.6s ease-in-out infinite}
@keyframes swipe{0%{top:22px;opacity:0}20%{opacity:1}80%{opacity:1}100%{top:0;opacity:0}}
.sep{width:1px;height:28px;background:rgba(107,31,74,.2)}

/* ---------- headlines ---------- */
.copy{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;padding:0 6vw;color:var(--tx);pointer-events:none;will-change:transform,opacity}
.mega{font-family:var(--sans);font-weight:900;letter-spacing:-.045em;line-height:.92;margin:0;font-size:var(--fs);text-shadow:0 10px 50px var(--sh)}
.mega .w{display:inline-block;white-space:nowrap}
.mega .ch{display:inline-block;will-change:transform,opacity}
.mega em{font-family:var(--serif);font-weight:500;font-style:italic;letter-spacing:-.02em}
.eyebrow{display:block;font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:600;margin-bottom:22px;opacity:.85}
.lede{font-family:var(--serif);font-style:italic;font-size:clamp(17px,1.7vw,24px);line-height:1.35;margin:26px auto 0;max-width:30ch;will-change:transform,opacity}

/* ---------- intro portal ---------- */
#s0 .stage{background:var(--paper)}
.intro{position:absolute;inset:0;pointer-events:none;color:var(--ink)}
.intro .ed{position:absolute;left:30px;bottom:34px;font-family:var(--serif);font-size:clamp(14px,1.2vw,17px);line-height:1.25}
.intro .ed i{display:block;font-size:clamp(26px,3vw,46px);font-weight:500;line-height:1.02;max-width:12ch;margin-top:8px}
.intro .vert{position:absolute;right:30px;bottom:34px;font-size:11px;line-height:1.7;text-align:right;opacity:.7}
.portal{position:absolute;inset:0;overflow:hidden;will-change:clip-path}
.portal-inner{position:absolute;inset:0;will-change:transform}
.puffs{position:absolute;inset:0;pointer-events:none}
.puff{position:absolute;left:0;top:0;border-radius:50%;background:radial-gradient(closest-side,#fff 0%,rgba(255,240,246,.9) 45%,rgba(255,240,246,0) 100%);will-change:transform}

/* ---------- final ---------- */
.again{pointer-events:auto;margin-top:34px;border:0;border-radius:999px;padding:15px 26px;font-size:15px;font-weight:800;background:linear-gradient(90deg,#ff6fa5,#ffb38a);color:#fff;box-shadow:0 16px 40px -12px rgba(255,111,165,.6);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.again:hover{transform:scale(1.07)}
.heart{display:inline-block;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}

/* ---------- grain, fx, cursor, loader ---------- */
#grain{position:fixed;inset:-50%;width:200%;height:200%;pointer-events:none;z-index:60;opacity:.1;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .2  0 0 0 0 .3  0 0 0 1.1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.cur-dot,.cur-ring{position:fixed;left:0;top:0;z-index:100;pointer-events:none;border-radius:50%;will-change:transform}
.cur-dot{width:8px;height:8px;margin:-4px 0 0 -4px;background:#fff;mix-blend-mode:difference}
.cur-ring{width:44px;height:44px;margin:-22px 0 0 -22px;border:1.5px solid #fff;mix-blend-mode:difference;transition:width .35s,height .35s,margin .35s,background .35s}
.cur-ring.big{width:84px;height:84px;margin:-42px 0 0 -42px;background:#fff}
.loader{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;pointer-events:none}
.loader .half{flex:1;background:#ffd6e4;transition:transform 1.1s cubic-bezier(.8,0,.15,1)}
.loader.done .half.t{transform:translateY(-100%)}
.loader.done .half.b{transform:translateY(100%)}
.loader .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;transition:opacity .4s;color:var(--ink)}
.loader.done .ctr{opacity:0}
.loader .ctr b{font-family:var(--serif);font-size:clamp(46px,7vw,96px);font-weight:800;letter-spacing:-2px;display:block}
.loader .ctr span{font-size:12px;letter-spacing:3px;text-transform:uppercase}
.loader .count{font-family:var(--serif);font-style:italic;font-size:22px;margin-top:10px}
.spinmoon{font-size:42px;display:block;margin-bottom:12px;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:760px){
  .nav{padding:18px 16px}
  .chapters,.progress{display:none}
  .guide{top:76px;gap:10px;padding:10px 16px 10px 12px;font-size:13px;max-width:calc(100vw - 32px)}
  .guide small{font-size:11px}
  .intro .ed{left:16px;bottom:24px}
  .intro .vert{display:none}
  .moon{right:8vw;top:16vh}
  .near .cl{filter:none}
}
@media (prefers-reduced-motion:reduce){.cl{animation-duration:400s!important}#grain{animation:none}}
</style>
</head>
<body>
<div id="spacer"></div>

<header class="nav">
  <a class="brand" href="#" id="brand"><b>Ngủ Ngon ☾</b><small>Một lời nhắn lúc khuya</small></a>
  <button class="pill" id="toTop" aria-label="Về đầu trang">↺ Từ đầu</button>
</header>

<div class="guide" id="guide" role="note">
  <div class="mouse" aria-hidden="true"></div>
  <div><span id="guideMain">Lăn chuột xuống để xem lời nhắn</span><small id="guideSub">Dùng điện thoại? Hãy vuốt màn hình lên nhé</small></div>
  <div class="sep" aria-hidden="true"></div>
  <div class="finger" aria-hidden="true"></div>
</div>

<main id="scenes"></main>

<ul class="chapters" id="chapters"></ul>
<div class="progress"><i id="prog"></i></div>
<div class="next" id="next">cuộn tiếp<span>↓</span></div>
<canvas id="fx"></canvas>
<div id="grain"></div>
<div class="cur-ring" id="ring"></div><div class="cur-dot" id="dot"></div>

<div class="loader" id="loader"><div class="half t"></div><div class="half b"></div>
  <div class="ctr"><div><span class="spinmoon">🌙</span><b>Ngủ ngon</b><span>đang gói mây hồng…</span><div class="count" id="count">0%</div></div></div>
</div>

<script>
const $ = s => document.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const win = (q, a, b) => clamp((q - a) / (b - a));
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eob = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const rr = (a, b) => a + Math.random() * (b - a);
const TOUCH = matchMedia('(pointer:coarse)').matches;

/* ---------- nội dung từng dòng ---------- */
const BIG = 'clamp(96px,24vw,400px)', MID = 'clamp(64px,13vw,220px)', LONG = 'clamp(50px,9.5vw,170px)';
const DATA = [
  { t: 'Hello', name: 'Hello', fs: BIG, eye: 'Tin nhắn lúc nửa đêm', lede: 'Có người đang nghĩ tới bạn nè.', sky: ['#ffbfd6', '#ffe0eb', '#fff3ea'], tx: '#6b1f4a', enter: 'none' },
  { t: 'Cũng khuya rồi', name: 'Cũng khuya rồi', fs: MID, eye: 'Đồng hồ đã điểm', lede: 'Đến mây cũng đã chuyển sang màu hồng ngái ngủ.', sky: ['#f9a6c8', '#ffcfe0', '#ffe5d8'], tx: '#6b1f4a', enter: 'circle' },
  { t: 'Bạn có mệt lắm không', name: 'Bạn có mệt lắm không', fs: LONG, eye: 'Hỏi nhỏ thôi', lede: 'Hôm nay chắc bạn đã cố gắng nhiều lắm.', sky: ['#f28cb7', '#f9b6ce', '#ffd6cd'], tx: '#5e1740', enter: 'tear' },
  { t: 'Chúc', name: 'Chúc', fs: BIG, sky: ['#e2779f', '#f3a0c1', '#fcc6c7'], tx: '#fff', enter: 'iris' },
  { t: 'Bạn', name: 'Bạn', fs: BIG, sky: ['#c9659c', '#e88cb6', '#f7b5c3'], tx: '#fff', enter: 'circleTop', stars: 18 },
  { t: 'Ngủ', name: 'Ngủ', fs: BIG, sky: ['#a5558f', '#d079aa', '#f0a1bc'], tx: '#fff', enter: 'slide', stars: 40, moon: true },
  { t: 'Ngon', name: 'Ngon', fs: BIG, sky: ['#844986', '#b8649f', '#e48fb1'], tx: '#fff', enter: 'tear', stars: 60, moon: true },
  { t: 'Nhé', name: 'Nhé', fs: BIG, sky: ['#683e7c', '#9b5693', '#d17ea7'], tx: '#fff', enter: 'circle', stars: 80, moon: true },
  { t: 'Bye', name: 'Bye', fs: BIG, eye: 'Hẹn gặp lại sáng mai', lede: 'Mơ một giấc thật đẹp nha <span class="heart">♡</span>', sky: ['#4d3170', '#844f8c', '#c679a5'], tx: '#fff', enter: 'iris', stars: 110, moon: true, last: true },
];

/* ---------- mây ---------- */
let gid = 0;
function cloudSVG(top, bot) {
  const id = 'g' + (gid++);
  const shapes = [
    [[60, 70, 34], [100, 50, 40], [145, 58, 34], [178, 76, 22], [30, 80, 20]],
    [[50, 72, 28], [88, 56, 34], [126, 44, 38], [166, 62, 30], [196, 80, 18]],
    [[44, 76, 24], [80, 58, 32], [118, 62, 28], [150, 72, 22]],
  ][Math.floor(Math.random() * 3)];
  const c = shapes.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('');
  return `<svg viewBox="0 0 220 110"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset=".25" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient></defs><g fill="url(#${id})">${c}<rect x="22" y="70" width="180" height="30" rx="15"/></g></svg>`;
}
function fillClouds(el, n, o, top, bot) {
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div'); d.className = 'cl';
    const dur = rr(o.d0, o.d1);
    d.style.cssText = `top:${rr(o.t0, o.t1)}%;width:${rr(o.w0, o.w1)}vw;animation-duration:${dur}s;animation-delay:${-rr(0, dur)}s`;
    d.innerHTML = `<div class="bob" style="animation-delay:${-rr(0, 6)}s">${cloudSVG(top, bot)}</div>`;
    el.appendChild(d);
  }
}
function bankSVG(top, bot) {
  const id = 'b' + (gid++); let c = '';
  for (let x = -40; x <= 1640; x += rr(70, 120)) c += `<circle cx="${x}" cy="${rr(120, 190)}" r="${rr(70, 130)}"/>`;
  return `<svg viewBox="0 0 1600 300" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient></defs><g fill="url(#${id})">${c}<rect x="0" y="200" width="1600" height="100"/></g></svg>`;
}
function edgeSVG(color) {
  let c = '';
  for (let x = 0; x <= 1640; x += 46) c += `<circle cx="${x}" cy="${rr(44, 60)}" r="${rr(26, 42)}"/>`;
  return `<svg viewBox="0 0 1600 62" preserveAspectRatio="none"><g fill="${color}">${c}<rect x="0" y="54" width="1600" height="10"/></g></svg>`;
}
const mix = (a, b, t) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(lerp(v, B[i], t)).toString(16).padStart(2, '0')).join(''); };

/* ---------- dựng các cảnh ---------- */
const root = $('#scenes');
DATA.forEach((d, i) => {
  const night = i / (DATA.length - 1);
  const cTop = mix('#ffffff', '#f6dff0', night), cBot = mix('#ffd3e3', '#b27fb5', night);
  const sec = document.createElement('section');
  sec.className = 'scene'; sec.id = 's' + i; sec.dataset.enter = d.enter;
  sec.dataset.len = d.last ? 2.6 : i === 0 ? 3.4 : d.t.length > 10 ? 3 : 2.4;
  sec.style.cssText = `--s1:${d.sky[0]};--s2:${d.sky[1]};--s3:${d.sky[2]};--tx:${d.tx};--fs:${d.fs};--sh:${d.tx === '#fff' ? 'rgba(90,20,70,.45)' : 'rgba(255,255,255,.7)'}`;
  const words = d.t.split(' ').map(w => `<span class="w">${[...w].map(c => `<span class="ch">${c}</span>`).join('')}</span>`).join(' ');
  const sky = `
    <div class="sky"></div><div class="glow"></div>
    ${d.stars ? '<div class="stars"></div>' : ''}
    ${d.moon ? '<div class="moon"></div>' : ''}
    <div class="layer far"></div><div class="layer mid"></div>
    <div class="copy">
      <span class="eyebrow">${String(i + 1).padStart(2, '0')} / ${String(DATA.length).padStart(2, '0')}${d.eye ? ' — ' + d.eye : ''}</span>
      <h1 class="mega">${words}</h1>
      ${d.lede ? `<p class="lede">${d.lede}</p>` : ''}
      ${d.last ? '<button class="again" id="again">↺ Xem lại từ đầu</button>' : ''}
    </div>
    <div class="layer near l"></div><div class="layer near r"></div>
    <div class="bank">${bankSVG(cTop, cBot)}</div>`;
  if (i === 0) {
    sec.innerHTML = `<div class="stage">
      <div class="intro" id="intro">
        <div class="ed">Gửi bạn — khuya nay<i>Một lời nhắn nhỏ trên mây.</i></div>
        <div class="vert">${DATA.map(x => x.name).join('<br>')}</div>
      </div>
      <div class="portal" id="portal"><div class="portal-inner" id="portalInner">${sky}</div></div>
      <div class="puffs" id="puffs"></div>
    </div>`;
  } else {
    sec.innerHTML = `<div class="stage">${sky}<div class="shade"></div></div>${d.enter === 'tear' ? `<div class="edge">${edgeSVG(d.sky[0])}</div>` : ''}`;
  }
  if (i === 0) sec.querySelector('.stage').insertAdjacentHTML('beforeend', '<div class="shade"></div>');
  root.appendChild(sec);
  const q = s => sec.querySelector(s);
  fillClouds(q('.far'), 7, { t0: 4, t1: 60, w0: 9, w1: 15, d0: 90, d1: 140 }, cTop, cBot);
  fillClouds(q('.mid'), 6, { t0: 8, t1: 78, w0: 18, w1: 28, d0: 60, d1: 95 }, cTop, cBot);
  // mây gần: phủ giữa màn hình rồi rẽ sang hai bên
  ['l', 'r'].forEach(side => {
    const el = q('.near.' + side);
    for (let k = 0; k < 3; k++) {
      const c = document.createElement('div'); c.className = 'cl'; c.style.animation = 'none';
      c.style.cssText += `top:${18 + k * 24 + rr(-4, 4)}%;width:${rr(38, 52)}vw;left:${side === 'l' ? rr(-6, 14) : rr(44, 62)}%`;
      c.innerHTML = `<div class="bob" style="animation-delay:${-rr(0, 6)}s">${cloudSVG(cTop, cBot)}</div>`;
      el.appendChild(c);
    }
  });
  if (d.stars) { const st = q('.stars'); for (let k = 0; k < d.stars; k++) st.insertAdjacentHTML('beforeend', `<i style="left:${rr(0, 100)}%;top:${rr(0, 55)}%;animation-delay:${-rr(0, 3)}s;transform:scale(${rr(.4, 1)})"></i>`); }
});

/* phồng mây quanh vòng tròn mở đầu */
const puffs = [];
for (let i = 0; i < 26; i++) {
  const p = document.createElement('div'); p.className = 'puff';
  const s = rr(90, 190); p.style.width = p.style.height = s + 'px'; p.style.marginLeft = p.style.marginTop = -s / 2 + 'px';
  $('#puffs').appendChild(p); puffs.push({ el: p, a: i / 26 * Math.PI * 2 + rr(-.1, .1), j: rr(-.04, .1) });
}

/* =========================================================
   Scene engine (giống Hạt Mầm)
========================================================= */
const SCN = [...document.querySelectorAll('.scene')].map((el, i) => ({
  el, i, stage: el.querySelector('.stage'), shade: el.querySelector('.shade'), len: +el.dataset.len, enter: el.dataset.enter,
  copy: el.querySelector('.copy'), chars: [...el.querySelectorAll('.ch')], eye: el.querySelector('.eyebrow'), lede: el.querySelector('.lede'),
  far: el.querySelector('.far'), mid: el.querySelector('.mid'), nl: el.querySelector('.near.l'), nr: el.querySelector('.near.r'),
  bank: el.querySelector('.bank'), moon: el.querySelector('.moon'), btn: el.querySelector('.again'), last: !!DATA[i].last,
}));
let W = innerWidth, H = innerHeight, target = 0, cur = 0, mx = 0, my = 0, tmx = 0, tmy = 0, total = 0;
const ENTER = .9;
function layout() {
  W = innerWidth; H = innerHeight; let acc = 0;
  SCN.forEach(s => { s.start = acc; s.px = s.len * H; acc += s.px; });
  total = acc; $('#spacer').style.height = (acc + H) + 'px';
  fx.width = W * devicePixelRatio; fx.height = H * devicePixelRatio;
}
const fx = $('#fx'), ctx = fx.getContext('2d');
layout(); addEventListener('resize', layout);
addEventListener('scroll', () => target = scrollY, { passive: true });
addEventListener('pointermove', e => { tmx = e.clientX / W * 2 - 1; tmy = e.clientY / H * 2 - 1; });

$('#chapters').innerHTML = SCN.map((s, i) => `<li data-go="${i}">${DATA[i].name}</li>`).join('');
const chapLis = [...document.querySelectorAll('#chapters li')];
function goTo(i) { const s = SCN[i]; const y = i === 0 ? 0 : s.start + ENTER * H + (s.px - ENTER * H) * .45; scrollTo({ top: y, behavior: 'instant' }); target = cur = y; }
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) goTo(+g.dataset.go); });
$('#brand').onclick = e => { e.preventDefault(); goTo(0); };
$('#toTop').onclick = () => goTo(0);
$('#again').onclick = () => goTo(0);
if (TOUCH) { $('#guideMain').textContent = 'Vuốt màn hình lên để xem lời nhắn'; $('#guideSub').textContent = 'Dùng máy tính? Lăn chuột xuống nhé'; }

function applyEnter(s, e) {
  const k = eio(e), el = s.el;
  el.style.clipPath = ''; el.style.transform = '';
  switch (s.enter) {
    case 'circle': el.style.clipPath = e >= 1 ? 'none' : `circle(${k * Math.hypot(W, H) * .55}px at 50% 50%)`; break;
    case 'circleTop': el.style.clipPath = e >= 1 ? 'none' : `circle(${k * Math.hypot(W, H) * 1.05}px at 50% 0%)`; break;
    case 'iris': el.style.clipPath = e >= 1 ? 'none' : `inset(${lerp(38, 0, k)}% ${lerp(40, 0, k)}% round ${lerp(40, 0, k)}px)`; break;
    case 'tear': el.style.transform = `translateY(${(1 - k) * (H + 70)}px)`; break;
    case 'slide': el.style.transform = `translateX(${(1 - k) * W}px)`; el.style.boxShadow = '-40px 0 80px rgba(40,0,30,.35)'; break;
  }
}
function letters(arr, t) {
  arr.forEach((c, i) => {
    const ti = clamp(t * (1 + arr.length * .09) - i * .09), b = eob(ti);
    c.style.opacity = clamp(ti * 1.6);
    c.style.transform = `translateY(${(1 - b) * 110}%) rotate(${(1 - ti) * 10}deg)`;
  });
}

function updateScene(s, q, t) {
  // q: 0..1 tiến độ sau khi cảnh đã vào
  const part = eio(win(q, 0, .38));
  s.nl.style.transform = `translate(${-part * 62 + mx * -30}vw,${my * -10}px) scale(${1 + part * .25})`;
  s.nr.style.transform = `translate(${part * 62 + mx * -30}vw,${my * -10}px) scale(${1 + part * .25})`;
  s.far.style.transform = `translate(${mx * -6}px,${my * -4 - q * 30}px)`;
  s.mid.style.transform = `translate(${mx * -16}px,${my * -8 - q * 80}px)`;
  s.bank.style.transform = `translate(${mx * -24}px,${q * 40}px)`;
  if (s.moon) s.moon.style.transform = `translate(${mx * -10}px,${(1 - q) * 30 + my * -6}px)`;
  letters(s.chars, win(q, .14, .46));
  const sub = win(q, .36, .5);
  s.eye.style.opacity = win(q, .1, .24);
  if (s.lede) { s.lede.style.opacity = sub; s.lede.style.transform = `translateY(${(1 - sub) * 20}px)`; }
  if (s.btn) s.btn.style.opacity = win(q, .5, .65);
  const out = s.last ? 0 : eio(win(q, .78, 1));
  s.copy.style.transform = `translateY(calc(-50% - ${out * 12}vh)) scale(${1 - out * .3})`;
  s.copy.style.opacity = 1 - out;
}

/* ---------- lấp lánh & tim bay ---------- */
const parts = [];
function spawn(n) {
  for (let i = 0; i < n; i++) parts.push({ x: rr(0, W), y: H + 20, vy: rr(.3, 1.1), vx: rr(-.3, .3), s: rr(4, 11), r: rr(0, 6), heart: Math.random() < .35, life: 1, c: Math.random() < .5 ? '255,255,255' : '255,170,205' });
}
function star(x, y, s) { ctx.beginPath(); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, rad = k % 2 ? s * .35 : s; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); } ctx.closePath(); ctx.fill(); }
function heart(x, y, s) { ctx.beginPath(); ctx.moveTo(x, y + s * .35); ctx.bezierCurveTo(x - s, y - s * .4, x - s * .4, y - s * 1.1, x, y - s * .45); ctx.bezierCurveTo(x + s * .4, y - s * 1.1, x + s, y - s * .4, x, y + s * .35); ctx.fill(); }

/* ---------- vòng lặp ---------- */
const ring = $('#ring'), dot = $('#dot'); let rx = 0, ry = 0, px = -100, py = -100;
if (!TOUCH) { document.body.classList.add('has-cursor'); addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; }); }
document.addEventListener('pointerover', e => ring.classList.toggle('big', !!e.target.closest('button,a,li')));

function frame(t) {
  cur += (target - cur) * .09; if (Math.abs(target - cur) < .1) cur = target;
  mx += (tmx - mx) * .06; my += (tmy - my) * .06;
  let active = 0;
  SCN.forEach((s, i) => {
    const next = SCN[i + 1], local = cur - s.start;
    const visible = (i === 0 || local >= 0) && (!next || cur < next.start + ENTER * H);
    s.el.style.visibility = visible ? 'visible' : 'hidden'; s.el.style.zIndex = i + 1;
    if (!visible) return;
    if (local >= -1) active = i;
    const e = i === 0 ? 1 : clamp(local / (ENTER * H));
    if (i > 0) applyEnter(s, e);
    const q = i === 0 ? clamp(local / s.px) : clamp((local - ENTER * H) / (s.px - ENTER * H));
    // cảnh cũ lùi lại khi cảnh mới vào
    const ne = next ? clamp((cur - next.start) / (ENTER * H)) : 0;
    s.stage.style.transform = `scale(${1 - eio(ne) * .08})`;
    if (s.shade) s.shade.style.opacity = eio(ne) * .55;
    if (i === 0) {
      const e0 = eio(win(q, 0, .3));
      const R0 = Math.min(W, H) * .26, R1 = Math.hypot(W, H) * .62, r = lerp(R0, R1, e0);
      $('#portal').style.clipPath = e0 >= 1 ? 'none' : `circle(${r}px at 50% 55%)`;
      $('#portalInner').style.transform = `scale(${lerp(1.35, 1, e0)})`;
      const po = 1 - win(q, .14, .3);
      puffs.forEach((p, k) => { const a = p.a + t * .00005 * (k % 2 ? 1 : -1), r2 = r * (1 + p.j); p.el.style.transform = `translate(${W / 2 + Math.cos(a) * r2}px,${H * .55 + Math.sin(a) * r2}px) scale(${1 + e0 * .8})`; p.el.style.opacity = po; });
      const io = win(q, .02, .14); $('#intro').style.opacity = 1 - io;
      updateScene(s, win(q, .22, 1), t);
    } else updateScene(s, q, t);
  });
  // hướng dẫn ở đầu trang: mờ dần khi bắt đầu cuộn
  const g = win(cur, 0, H * .35); $('#guide').style.opacity = 1 - g; $('#guide').style.transform = `translate(-50%,${-g * 30}px)`;
  $('#next').style.opacity = cur > H * .3 && cur < total - SCN.at(-1).px * .3 ? .9 : 0;
  chapLis.forEach((li, i) => li.classList.toggle('on', i === active));
  $('#prog').style.height = clamp(cur / total) * 100 + '%';
  // hạt lấp lánh — càng về khuya càng nhiều
  if (Math.random() < .08 + active * .05) spawn(1);
  const dpr = devicePixelRatio; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  for (let k = parts.length - 1; k >= 0; k--) {
    const p = parts[k]; p.y -= p.vy; p.x += p.vx + Math.sin(t * .001 + p.r) * .3; p.life -= .0022;
    if (p.life <= 0 || p.y < -20) { parts.splice(k, 1); continue; }
    ctx.fillStyle = `rgba(${p.c},${Math.min(1, p.life) * .8})`;
    p.heart ? heart(p.x, p.y, p.s) : star(p.x, p.y, p.s * .7);
  }
  rx += (px - rx) * .18; ry += (py - ry) * .18;
  dot.style.transform = `translate(${px}px,${py}px)`; ring.style.transform = `translate(${rx}px,${ry}px)`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- loader ---------- */
document.documentElement.style.overflow = 'hidden'; scrollTo(0, 0);
let c = 0; const cnt = $('#count');
const iv = setInterval(() => { c = Math.min(100, c + Math.ceil(rr(3, 9))); cnt.textContent = c + '%'; if (c >= 100) { clearInterval(iv); setTimeout(() => { $('#loader').classList.add('done'); document.documentElement.style.overflow = ''; }, 250); } }, 45);
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
</script>
</body>
</html>
